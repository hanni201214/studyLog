<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyLog</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.app{max-width:520px;margin:auto;padding:18px 14px 90px}.top{display:flex;justify-content:space-between;align-items:center}.card{background:#fff;border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 2px 10px #0000000d}.tabs{display:flex;gap:6px;margin:12px 0}.tabs button,.btn{border:0;border-radius:10px;padding:10px 12px;background:#eaf1ff;color:#2563eb}.tabs button.on,.primary{background:#2563eb;color:#fff}.row{display:flex;align-items:center;gap:10px}.grow{flex:1}.chapter{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid #eee}.chapter:first-child{border-top:0}.dot{width:10px;height:10px;border-radius:50%;background:#cbd5e1}.dot.done{background:#16a34a}.dot.review{background:#f59e0b}.phase{font-size:11px;padding:4px 7px;border-radius:8px;background:#f1f5f9;color:#64748b}.phase.done{background:#dcfce7;color:#15803d}.phase.review{background:#fef3c7;color:#b45309}.menu{position:relative}.dots{font-size:22px;background:none;border:0;padding:5px 9px}.popup{display:none;position:absolute;right:0;top:38px;background:white;border:1px solid #ddd;border-radius:10px;padding:5px;z-index:20;box-shadow:0 5px 20px #0002}.popup.open{display:block}.popup button{white-space:nowrap;border:0;background:white;color:#dc2626;padding:10px 14px;border-radius:8px}.task{display:flex;align-items:center;gap:9px;padding:10px 0;border-top:1px solid #eee}.task:first-child{border-top:0}.check{width:22px;height:22px;border:2px solid #cbd5e1;border-radius:50%;background:#fff;flex-shrink:0}.check.done{background:#16a34a;border-color:#16a34a;color:#fff}.done-task{opacity:.6}.done-task .task-title{text-decoration:line-through}.small{font-size:12px;color:#718096}.modal{display:none;position:fixed;inset:0;background:#0006;align-items:flex-end;z-index:50}.modal.open{display:flex}.sheet{width:100%;max-width:520px;margin:auto;background:white;border-radius:20px 20px 0 0;padding:18px}.sheet input,.sheet select{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #ddd;border-radius:10px}.danger{background:#fee2e2;color:#b91c1c}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:center;gap:30px;padding:10px}.nav button{border:0;background:none;color:#64748b}.nav .on{color:#2563eb;font-weight:bold}.primary{border:0;border-radius:10px;padding:12px 14px}
</style></head><body><div id="app" class="app"></div><div id="subjectModal" class="modal"><div class="sheet"><h3>科目を追加</h3><input id="newSubject" placeholder="例：物理"><button class="primary" onclick="saveSubject()">追加</button> <button class="btn" onclick="closeSubjectModal()">キャンセル</button></div></div>
<div id="materialModal" class="modal"><div class="sheet"><h3>教材を追加</h3><input id="newMaterial" placeholder="教材名（例：数学問題集）"><button class="primary" onclick="saveMaterial()">教材を作成</button> <button class="btn" onclick="closeMaterialModal()">キャンセル</button></div></div><div id="chapterModal" class="modal"><div class="sheet"><h3>章を追加</h3><input id="newChapter" placeholder="例：第1章 数と式"><button class="primary" onclick="saveChapter()">章を追加</button> <button class="btn" onclick="closeChapterModal()">キャンセル</button></div></div>
<div id="modal" class="modal"><div class="sheet"><h3 id="modalTitle">タスク追加</h3><input id="title" placeholder="タスク名"><select id="subject"><option value="">教科なし</option><option>英語</option><option>数学</option><option>国語</option><option>理科</option><option>社会</option></select><input id="date" type="date"><input id="memo" placeholder="メモ（任意）"><button class="primary" id="saveBtn" onclick="saveTask()">保存</button> <button class="btn" onclick="closeModal()">キャンセル</button></div></div>
<script>
const KEY='studylog_simple_v1';
let data=JSON.parse(localStorage.getItem(KEY)||'null')||{materials:[{id:1,subject:'英語',type:'教科書',name:'New Horizon',chapters:['Chapter 1','Chapter 2','Chapter 3'].map((name,i)=>({id:11+i,name,done:i===0}))},{id:2,subject:'数学',type:'教科書',name:'数学教科書',chapters:['第1章 数と式','第2章 図形と証明','第3章 関数'].map((name,i)=>({id:21+i,name,done:i===0}))}],tasks:[]};
let page='home', subject=(data.subjects&&data.subjects[0])||'英語', type='教科書', editId=null;
if(!data.subjects){data.subjects=[...new Set(data.materials.map(m=>m.subject))];}
if(!data.subjects.length){data.subjects=['英語'];}
data.materials.forEach(function(m){m.chapters.forEach(function(c){if(c.status!=='done'&&c.status!=='review'&&c.status!=='not_started'){c.status=c.done?'done':'not_started';}c.done=c.status==='done';});});
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){let a=document.getElementById('app');if(page==='home')a.innerHTML=home();else if(page==='subjects')a.innerHTML=subjects();else a.innerHTML=tasks();nav()}
function home(){let total=0,score=0,done=0,review=0;data.materials.forEach(m=>m.chapters.forEach(c=>{total++;let s=c.status||(c.done?'done':'not_started');if(s==='done'){score+=1;done++}else if(s==='review'){score+=0.5;review++}}));let percent=total?Math.round(score/total*100):0;return `<div class="top"><div><h1>StudyLog</h1><div class="small">勉強をコツコツ管理</div></div><button class="primary" onclick="openModal()">＋ タスク</button></div><div class="card"><b>全体の進捗</b><h2>${percent}%</h2><div class="small">${done}/${total}章 完了 ・ ${review}章 復習中</div><div style="height:8px;background:#e5e7eb;border-radius:8px;margin-top:10px;overflow:hidden"><div style="height:100%;width:${percent}%;background:#2563eb;border-radius:8px;transition:width .15s"></div></div></div><h3>今日やること</h3><div class="card">${taskList(5)}</div>`}
function subjects(){let s=subject;let mats=data.materials.filter(m=>m.subject===s&&m.type===type);return `<div class="top"><div><h1>${esc(s)}</h1><div class="small">教材を管理</div></div><button class="primary" onclick="addSubject()">＋ 科目</button></div><div class="tabs">${data.subjects.map(n=>`<button class="${n===s?'on':''}" onclick="subject='${esc(n)}';render()">${esc(n)}</button>`).join('')}</div><div class="tabs"><button class="${type==='教科書'?'on':''}" onclick="type='教科書';render()">教科書</button><button class="${type==='問題集'?'on':''}" onclick="type='問題集';render()">問題集</button></div>${mats.length?mats.map(materialHtml).join(''):'<div class="card">この種類の教材はありません</div>'}<button class="primary" onclick="addMaterial()">＋ ${esc(s)}の教材を追加</button></div>}`}
function addSubject(){document.getElementById('newSubject').value='';document.getElementById('subjectModal').classList.add('open');setTimeout(function(){document.getElementById('newSubject').focus()},0)}
function closeSubjectModal(){document.getElementById('subjectModal').classList.remove('open')}
function saveSubject(){let name=document.getElementById('newSubject').value.trim();if(!name)return;if(data.subjects.indexOf(name)>=0){subject=name;closeSubjectModal();render();return;}data.subjects.push(name);subject=name;save();closeSubjectModal();render()}
function phaseName(c){return c.status==='done'?'完了':c.status==='review'?'復習フェーズ':'未着手'}
function materialHtml(m){return `<div class="card"><div class="row"><div class="grow"><b>${esc(m.name)}</b><div class="small">${m.chapters.length}章</div></div><button class="primary" style="width:auto;margin:0" onclick="openChapterModal(${m.id})">＋ 章を追加</button></div>${m.chapters.length?m.chapters.map((c,i)=>`<div class="chapter"><span class="dot ${c.status==='done'?'done':c.status==='review'?'review':''}"></span><button class="grow" style="border:0;background:none;text-align:left" onclick="toggleChapter(${m.id},${i})">${esc(c.name)}<div class="small">${phaseName(c)}</div></button><span class="phase ${c.status==='done'?'done':c.status==='review'?'review':''}">${phaseName(c)}</span><div class="menu"><button class="dots" onclick="menu(event,this)">⋮</button><div class="popup"><button onclick="addChapterTask(${m.id},${i});return false;">＋ タスクに追加</button><button onclick="deleteChapter(${m.id},${i});return false;">🗑️ この章を削除</button></div></div></div>`).join(''):'<div class="small" style="padding-top:12px">まだ章がありません</div>'}</div>`}
function tasks(){return `<div class="top"><h1>タスク</h1><button class="primary" onclick="openModal()">＋ 追加</button></div><div class="card">${taskList(999)||'<div class="small">タスクはありません</div>'}</div>`}
function taskList(n){let a=data.tasks.slice().sort(function(x,y){return Number(x.done)-Number(y.done)}).slice(0,n);return a.map(t=>`<div class="task ${t.done?'done-task':''}"><button class="check ${t.done?'done':''}" onclick="completeTask(${t.id})">${t.done?'✓':''}</button><div class="grow"><b class="task-title">${esc(t.title)}</b><div class="small">${esc(t.subject||'')} ${esc(t.date||'')} ${esc(t.memo||'')}</div></div><button class="btn" onclick="editTask(${t.id})">編集</button><button class="btn danger" onclick="deleteTask(${t.id})">削除</button></div>`).join('')}
function nav(){document.querySelectorAll('.nav').forEach(x=>x.remove());document.body.insertAdjacentHTML('beforeend',`<div class="nav"><button class="${page==='home'?'on':''}" onclick="page='home';render()">⌂ ホーム</button><button class="${page==='subjects'?'on':''}" onclick="page='subjects';render()">📚 教材</button><button class="${page==='tasks'?'on':''}" onclick="page='tasks';render()">□ タスク</button></div>`)}
function menu(e,b){e.preventDefault();e.stopPropagation();document.querySelectorAll('.popup').forEach(x=>x.classList.remove('open'));b.nextElementSibling.classList.add('open')}
document.addEventListener('click',function(){document.querySelectorAll('.popup').forEach(function(x){x.classList.remove('open')})});
function addChapterTask(mid,i){let m=data.materials.find(function(x){return x.id===mid});if(!m)return;let c=m.chapters[i];if(!c)return;data.tasks.unshift({id:Date.now(),title:c.name,subject:m.subject,date:'',memo:m.name+'・'+m.type,done:false,sourceMaterialId:m.id,sourceChapterId:c.id});save();page='tasks';render()}
function deleteChapter(mid,i){let m=data.materials.find(x=>x.id===mid);if(!m)return;if(i<0||i>=m.chapters.length)return;m.chapters.splice(i,1);save();render()}
function toggleChapter(mid,i){let m=data.materials.find(x=>x.id===mid);if(!m||!m.chapters[i])return;let c=m.chapters[i];if(c.status==='not_started'){c.status='done'}else if(c.status==='done'){c.status='review'}else{c.status='not_started'}c.done=c.status==='done';save();render()}
function completeTask(id){let t=data.tasks.find(x=>x.id===id);if(t){t.done=!t.done;save();render()}}
function deleteTask(id){if(confirm('このタスクを削除しますか？')){data.tasks=data.tasks.filter(x=>x.id!==id);save();render()}}
function openModal(){editId=null;document.getElementById('modalTitle').textContent='タスク追加';document.getElementById('saveBtn').textContent='保存';['title','date','memo'].forEach(x=>document.getElementById(x).value='');document.getElementById('subject').value='';document.getElementById('modal').classList.add('open')}
function editTask(id){let t=data.tasks.find(x=>x.id===id);if(!t)return;editId=id;document.getElementById('modalTitle').textContent='タスク編集';document.getElementById('saveBtn').textContent='変更を保存';document.getElementById('title').value=t.title;document.getElementById('subject').value=t.subject||'';document.getElementById('date').value=t.date||'';document.getElementById('memo').value=t.memo||'';document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function saveTask(){let title=document.getElementById('title').value.trim();if(!title){alert('タスク名を入力してください');return}let t={title,subject:document.getElementById('subject').value,date:document.getElementById('date').value,memo:document.getElementById('memo').value};if(editId){let old=data.tasks.find(x=>x.id===editId);Object.assign(old,t)}else data.tasks.unshift({id:Date.now(),...t,done:false});save();closeModal();page='tasks';render()}
function addMaterial(){document.getElementById('newMaterial').value='';document.getElementById('materialModal').classList.add('open');setTimeout(function(){document.getElementById('newMaterial').focus()},0)}
function closeMaterialModal(){document.getElementById('materialModal').classList.remove('open')}
function saveMaterial(){let name=document.getElementById('newMaterial').value.trim();if(!name)return;let now=Date.now();data.materials.push({id:now,subject,type,name,chapters:[]});save();closeMaterialModal();render()}
function openChapterModal(mid){document.getElementById('chapterModal').dataset.mid=mid;document.getElementById('newChapter').value='';document.getElementById('chapterModal').classList.add('open');setTimeout(function(){document.getElementById('newChapter').focus()},0)}
function closeChapterModal(){document.getElementById('chapterModal').classList.remove('open')}
function saveChapter(){let mid=Number(document.getElementById('chapterModal').dataset.mid);let name=document.getElementById('newChapter').value.trim();if(!name)return;let m=data.materials.find(function(x){return x.id===mid});if(!m)return;m.chapters.push({id:Date.now(),name:name,status:'not_started',done:false});save();closeChapterModal();render()}
render();
</script></body></html>
